server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
      
    # Interceptar CUALQUIER logo que falle
    location ~* logo_(light|dark)\.png$ {
        # Si no existe en la ruta actual, servir desde raíz
        try_files $uri /logo_$1.png @logofallback;
    }
    
    location @logofallback {
        # Siempre servir desde /public/ (raíz del sitio)
        rewrite ^/(.*)$ /logo_$1.png last;
    }
    # ---------------------------------

    # Reescribir para eliminar /contactos/
    location /contactos/ {
        #rewrite ^/contactos/(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.ht {
        deny all;
    }
}